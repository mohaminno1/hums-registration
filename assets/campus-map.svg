<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="نقشه شماتیک محوطه دانشکده دندانپزشکی و داروسازی">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#EBE6DE" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- پس‌زمینه کاغذی -->
  <rect width="900" height="540" fill="#F8F6F1"/>
  <rect width="900" height="540" fill="url(#grid)"/>

  <!-- مسیرهای پیاده‌رو و خیابان داخلی -->
  <path d="M 450 510 L 450 90" stroke="#E2DDD5" stroke-width="26" stroke-linecap="round"/>
  <path d="M 110 270 L 790 270" stroke="#E2DDD5" stroke-width="22" stroke-linecap="round"/>
  <circle cx="450" cy="270" r="42" fill="#EBF3F5" stroke="#0F4C5C" stroke-width="1.6"/>
  <text x="450" y="275" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="12.5" font-weight="700" fill="#0F4C5C">میدان مرکزی</text>

  <!-- ساختمان ۱: آموزش و پذیرش -->
  <g>
    <rect x="520" y="340" width="260" height="108" rx="8" fill="#FFFFFF" stroke="#0F4C5C" stroke-width="2"/>
    <circle cx="754" cy="366" r="15" fill="#0F4C5C"/>
    <text x="754" y="371" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">۱</text>
    <text x="642" y="396" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="14.5" font-weight="700" fill="#1E242B">ساختمان آموزش و پذیرش</text>
    <text x="642" y="422" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="12" fill="#5A626A">گام‌های ۱ تا ۳ ثبت‌نام</text>
  </g>

  <!-- ساختمان ۲: دانشکده دندانپزشکی -->
  <g>
    <rect x="520" y="92" width="260" height="114" rx="8" fill="#FFFFFF" stroke="#1E242B" stroke-width="1.6"/>
    <circle cx="754" cy="118" r="15" fill="#0F4C5C"/>
    <text x="754" y="123" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">۲</text>
    <text x="642" y="152" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="14.5" font-weight="700" fill="#1E242B">دانشکده دندانپزشکی</text>
    <text x="642" y="177" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="12" fill="#5A626A">کلینیک و تالارهای درسی</text>
  </g>

  <!-- ساختمان ۳: دانشکده داروسازی -->
  <g>
    <rect x="120" y="92" width="260" height="114" rx="8" fill="#FFFFFF" stroke="#1E242B" stroke-width="1.6"/>
    <circle cx="354" cy="118" r="15" fill="#0F4C5C"/>
    <text x="354" y="123" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">۳</text>
    <text x="242" y="152" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="14.5" font-weight="700" fill="#1E242B">دانشکده داروسازی</text>
    <text x="242" y="177" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="12" fill="#5A626A">آزمایشگاه‌ها و کلاس‌ها</text>
  </g>

  <!-- ساختمان ۴: معاونت دانشجویی -->
  <g>
    <rect x="120" y="340" width="260" height="108" rx="8" fill="#FFFFFF" stroke="#0F4C5C" stroke-width="2"/>
    <circle cx="354" cy="366" r="15" fill="#0F4C5C"/>
    <text x="354" y="371" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">۴</text>
    <text x="242" y="396" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#1E242B">معاونت دانشجویی و بهداشت</text>
    <text x="242" y="422" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="12" fill="#5A626A">خوابگاه، تغذیه و پایش سلامت</text>
  </g>

  <!-- ساختمان ۵: سلف و کتابخانه -->
  <g>
    <rect x="30" y="220" width="154" height="98" rx="8" fill="#FFFFFF" stroke="#1E242B" stroke-width="1.6"/>
    <circle cx="160" cy="242" r="13" fill="#0F4C5C"/>
    <text x="160" y="247" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">۵</text>
    <text x="100" y="274" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="13.5" font-weight="700" fill="#1E242B">سلف و کتابخانه</text>
    <text x="100" y="296" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="11" fill="#5A626A">سالن مطالعه</text>
  </g>

  <!-- ساختمان ۶: سالن چندمنظوره و تشکل‌ها -->
  <g>
    <rect x="716" y="220" width="154" height="98" rx="8" fill="#FFFFFF" stroke="#1E242B" stroke-width="1.6"/>
    <circle cx="846" cy="242" r="13" fill="#0F4C5C"/>
    <text x="846" y="247" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">۶</text>
    <text x="786" y="274" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="13.5" font-weight="700" fill="#1E242B">سالن چندمنظوره</text>
    <text x="786" y="296" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="11" fill="#5A626A">غرفه تشکل‌ها</text>
  </g>

  <!-- ورودی اصلی -->
  <g>
    <rect x="372" y="486" width="156" height="34" rx="6" fill="#0F4C5C"/>
    <text x="450" y="508" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">ورودی اصلی دانشکده</text>
  </g>

  <!-- جهت شمال -->
  <g transform="translate(56, 52)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#E2DDD5" stroke-width="1.4"/>
    <path d="M 0 -12 L 5 6 L 0 2 L -5 6 Z" fill="#0F4C5C"/>
    <text x="0" y="16" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="10" font-weight="700" fill="#5A626A">شمال</text>
  </g>

  <!-- برچسب راهنمای جایگزینی -->
  <text x="450" y="36" text-anchor="middle" font-family="Vazirmatn FD, Tahoma, sans-serif" font-size="12" fill="#5A626A">نقشه شماتیک پیش‌فرض محوطه دانشکده (قابل جایگزینی با تصویر واقعی)</text>
</svg>
